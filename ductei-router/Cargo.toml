[package]
name = "ductei-router"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ATRIUM task router: CANON gate, deterministic tier routing, hash-chained decision receipts"

[features]
# ML-DSA-65 signing of decision receipts, via ductei-mcp's receipt log.
sign = ["ductei-mcp/sign"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ductei-mcp = { path = "../ductei-mcp" }

[[bin]]
name = "ductei-route"
path = "src/bin/ductei-route.rs"
