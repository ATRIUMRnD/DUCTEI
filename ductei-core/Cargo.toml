[package]
name = "ductei-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[features]
# GAP 4: network transport (TCP framing) is opt-in. With no feature enabled,
# ductei-core has no network code at all -- callers get only the local
# Channel/spool path, so "no network available" degrades by construction
# rather than by runtime detection.
net = []
grpc = ["net", "dep:tonic", "dep:prost", "dep:tokio", "dep:tonic-build", "dep:protoc-bin-vendored"]
quic = ["net", "dep:quinn", "dep:rustls", "dep:rcgen", "dep:tokio"]
# Post-quantum transport crypto lives in QFLTL's qfltl-crypto (used by
# ductei-sync --features qfltl); the unused `pq` wrapper was removed so the
# stack has one ML-KEM implementation.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = { version = "0.11", optional = true }
prost = { version = "0.12", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"], optional = true }
quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
rcgen = { version = "0.13", optional = true }

[[bin]]
name = "ductei-net-smoke"
path = "src/bin/ductei-net-smoke.rs"
required-features = ["net"]

[[bin]]
name = "ductei-node"
path = "src/bin/ductei-node.rs"
required-features = ["net"]

[build-dependencies]
tonic-build = { version = "0.11", optional = true }
protoc-bin-vendored = { version = "3", optional = true }

[dev-dependencies]
ductei-limen = { path = "../ductei-limen" }
ductei-qallow = { path = "../ductei-qallow" }
ductei-veyn = { path = "../ductei-veyn" }

[lints.rust]
# `cargo kani` sets cfg(kani); see src/proofs.rs
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
