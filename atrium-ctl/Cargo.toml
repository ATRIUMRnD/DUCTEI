[package]
name = "atrium-ctl"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "atrium: the one front door that boots, watches, chains and verifies every ATRIUM room"

[features]
# ML-DSA signing of the heartbeat chain, same key store the gate and QHR use.
sign = ["ductei-mcp/sign"]
# Push chain-head anchors over the QFLTL transport (never plaintext when anchor.encrypt).
qfltl = ["ductei-mcp/qfltl"]

[dependencies]
ductei-mcp = { path = "../ductei-mcp" }
ductei-core = { path = "../ductei-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"

[[bin]]
name = "atrium"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
# Job Objects: a managed room's whole process tree dies with it (and with atrium).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

