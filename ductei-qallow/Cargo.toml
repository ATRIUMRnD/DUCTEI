[package]
name = "ductei-qallow"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ductei-core = { path = "../ductei-core" }

[[bin]]
name = "ductei-qallow-relay"
path = "src/bin/relay.rs"

[lints.rust]
# `cargo kani` sets cfg(kani); see src/proofs.rs
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
