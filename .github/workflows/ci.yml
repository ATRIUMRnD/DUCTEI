name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo test --workspace
      - run: cargo test --workspace --features ductei-core/net
      - run: cargo test --workspace --features ductei-core/pq
      - name: conformance vs Qallow C decoder
        run: |
          git clone --depth 1 https://github.com/xingxerx/Qallow.git /tmp/Qallow
          cargo build -p conformance-emitter
          ./target/debug/emit /tmp/stream.bin
          gcc -I/tmp/Qallow/include -o conformance/verify conformance/verify.c /tmp/Qallow/src/mind/sync_wire.c
          ./conformance/verify /tmp/stream.bin
          # v2 conformance (Task 5): requires Qallow main to carry the
          # v2 decoder, so this commit lands only after Qallow's.
          ./target/debug/emit /tmp/stream_v2.bin v2
          ./conformance/verify /tmp/stream_v2.bin v2

  # End-to-end smoke: limend -> ductei-limen-relay, four scenarios
  # (good job, restart replicability, malformed request, malformed cert)
  # with the hard invariants asserted inline. See scripts/smoke_e2e.py.
  e2e-smoke:
    runs-on: ubuntu-latest
    env:
      # Rev-pin discipline (ATRIUM AGENTS.md): bumping this pin is a
      # deliberate, auditable commit, never an implicit float to main.
      LIMEN_REV: 7522a16d5f3b9ff96284c17008a612072d24a264
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: checkout LIMEN at pinned rev
        run: |
          git clone https://github.com/xingxerx/LIMEN.git /tmp/LIMEN
          git -C /tmp/LIMEN checkout "$LIMEN_REV"
      - name: install LIMEN (simulator path only, no QPU extras)
        run: pip install /tmp/LIMEN
      - name: run smoke scenarios
        run: python scripts/smoke_e2e.py --limen /tmp/LIMEN

  # Second real consumer pair: limend -> ductei-limen-relay ->
  # ductei-qallow-relay -> real `qallow ingest` -> real LMDB. See
  # ATRIUM harness-roadmap/02-spine-flow.md ("Qallow pair first").
  e2e-smoke-qallow:
    runs-on: ubuntu-latest
    env:
      # Qallow pin >= 2b0009e (ATRIUM Task 4): the persist gate now
      # requires schema_ver 2 + persist-v2 payloads, which
      # ductei_qallow::persist supplies. An older pin would pass for the
      # wrong reason (no gate); a newer relay against an older Qallow is
      # also fine (the v2 header is just data to a pre-Task-4 store).
      LIMEN_REV: 7522a16d5f3b9ff96284c17008a612072d24a264
      QALLOW_REV: e69ebd0acaa005916e9207537b34aabe8ce25a01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: checkout LIMEN at pinned rev
        run: |
          git clone https://github.com/xingxerx/LIMEN.git /tmp/LIMEN
          git -C /tmp/LIMEN checkout "$LIMEN_REV"
      - name: install LIMEN (simulator path only, no QPU extras)
        run: pip install /tmp/LIMEN
      - name: checkout and build Qallow at pinned rev
        run: |
          git clone https://github.com/xingxerx/Qallow.git /tmp/Qallow
          git -C /tmp/Qallow checkout "$QALLOW_REV"
          cargo build --manifest-path /tmp/Qallow/Cargo.toml -p qallow_cli
      - name: run smoke scenarios
        run: |
          python scripts/smoke_qallow.py --limen /tmp/LIMEN \
            --qallow-cli /tmp/Qallow/target/debug/qallow

  # Third real consumer pair: VEYN's in-process ductei_bridge ->
  # ductei-qallow-relay (reused unmodified) -> `qallow ingest` -> LMDB.
  # See ATRIUM harness-roadmap/02-spine-flow.md ("VEYN pair second").
  e2e-smoke-veyn:
    runs-on: ubuntu-latest
    env:
      VEYN_REV: 06cb9eaa4b1f970ac20c596d4da0c4e19c2a3ede
      QALLOW_REV: e69ebd0acaa005916e9207537b34aabe8ce25a01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: checkout VEYN at pinned rev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ATRIUMRnD/VEYN
          ref: ${{ env.VEYN_REV }}
          path: veyn-checkout
          token: ${{ secrets.VEYN_READ_TOKEN }}
      - name: place VEYN at /tmp/VEYN
        run: |
          rm -rf /tmp/VEYN
          cp -a veyn-checkout /tmp/VEYN
      - name: install VEYN's system deps (BLE/dbus, ALSA, HID/udev)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libasound2-dev libudev-dev pkg-config
      - name: checkout and build Qallow at pinned rev
        run: |
          git clone https://github.com/xingxerx/Qallow.git /tmp/Qallow
          git -C /tmp/Qallow checkout "$QALLOW_REV"
          cargo build --manifest-path /tmp/Qallow/Cargo.toml -p qallow_cli
      - name: run smoke scenarios
        run: |
          python scripts/smoke_veyn.py --veyn /tmp/VEYN \
            --qallow-cli /tmp/Qallow/target/debug/qallow

  # One app: VEYN cue -> DUCTEI -> shared Qallow LMDB -> `qallow propose`
  # -> limend -> DUCTEI -> the same LMDB. See scripts/smoke_loop.py and
  # ATRIUM harness-roadmap/07-one-app-integration.md.
  e2e-smoke-loop:
    runs-on: ubuntu-latest
    env:
      LIMEN_REV: 7522a16d5f3b9ff96284c17008a612072d24a264
      VEYN_REV: 06cb9eaa4b1f970ac20c596d4da0c4e19c2a3ede
      # Must point at a Qallow rev that carries `qallow propose`
      # (qallow_cli/src/propose.rs). Bump in a separate, auditable
      # commit once that lands on Qallow main; until then this job is
      # expected red and must not be a required check.
      QALLOW_REV: e69ebd0acaa005916e9207537b34aabe8ce25a01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: checkout LIMEN at pinned rev
        run: |
          git clone https://github.com/xingxerx/LIMEN.git /tmp/LIMEN
          git -C /tmp/LIMEN checkout "$LIMEN_REV"
      - name: install LIMEN (simulator path only, no QPU extras)
        run: pip install /tmp/LIMEN
      - name: checkout VEYN at pinned rev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ATRIUMRnD/VEYN
          ref: ${{ env.VEYN_REV }}
          path: veyn-checkout
          token: ${{ secrets.VEYN_READ_TOKEN }}
      - name: place VEYN at /tmp/VEYN
        run: |
          rm -rf /tmp/VEYN
          cp -a veyn-checkout /tmp/VEYN
      - name: install VEYN's system deps (BLE/dbus, ALSA, HID/udev)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libasound2-dev libudev-dev pkg-config
      - name: checkout and build Qallow at pinned rev
        run: |
          git clone https://github.com/xingxerx/Qallow.git /tmp/Qallow
          git -C /tmp/Qallow checkout "$QALLOW_REV"
          cargo build --manifest-path /tmp/Qallow/Cargo.toml -p qallow_cli
      - name: run the one-app loop
        run: |
          python scripts/smoke_loop.py --limen /tmp/LIMEN --veyn /tmp/VEYN             --qallow-cli /tmp/Qallow/target/debug/qallow
