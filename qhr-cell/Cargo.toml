[package]
name = "qhr-cell"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "QHR cells: pocket-sized, deterministic, deadline-bounded units of work with versioned snapshot state (the superposition/measurement vocabulary of the hyper driver, as plain Rust)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
