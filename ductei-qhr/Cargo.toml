[package]
name = "ductei-qhr"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ATRIUM Quantum Hybrid Runtime: gated, deadline-bound job plane over local lanes with hash-chained receipts"

[features]
# ML-DSA signing of QHR receipts (same key handling as ductei-mcp).
sign = ["ductei-router/sign", "ductei-mcp/sign"]

[dependencies]
ductei-router = { path = "../ductei-router" }
ductei-mcp = { path = "../ductei-mcp" }
ductei-limen = { path = "../ductei-limen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "qhr"
path = "src/bin/qhr.rs"
